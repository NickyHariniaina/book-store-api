openapi: "3.0.3"
info:
  title: Bookstore API
  version: "1.0.0"
  description: >
    REST API for the onlydevs bookstore digitalization platform.
    Covers catalog management, inventory tracking, and point-of-sale.
servers:
  - url: /
    description: Default server
tags:
  - name: Books
  - name: BookAuthors
  - name: Authors
  - name: BookEditions
  - name: Genres
  - name: Publishers
  - name: BookStores
  - name: Inventory
  - name: Customers
  - name: BookPriceHistory
  - name: Dashboard
components:
  schemas:
    AuthorRole:
      type: string
      enum: [PRIMARY, CO_AUTHOR, EDITOR, TRANSLATOR, ILLUSTRATOR, FOREWORD]
    BookFormat:
      type: string
      enum: [HARDCOVER, PAPERBACK, EBOOK, AUDIOBOOK]
    InventoryMovementType:
      type: string
      enum: [ARRIVAL, SALE, ADJUSTMENT, DAMAGED, LOST]

    CreateBookRequest:
      type: object
      required: [title]
      properties:
        title: { type: string, maxLength: 255 }
        summary: { type: string, maxLength: 2000 }
        language: { type: string, maxLength: 50 }
        coverUrl: { type: string, maxLength: 500 }
    UpdateBookRequest:
      type: object
      properties:
        title: { type: string, maxLength: 255 }
        summary: { type: string, maxLength: 2000 }
        language: { type: string, maxLength: 50 }
        coverUrl: { type: string, maxLength: 500 }
    CreateBookEditionRequest:
      type: object
      required: [publisherId, isbn, format]
      properties:
        publisherId: { type: string, format: uuid }
        isbn: { type: string, maxLength: 20 }
        edition: { type: string, maxLength: 100 }
        format: { $ref: '#/components/schemas/BookFormat' }
    UpdateBookEditionRequest:
      type: object
      properties:
        isbn: { type: string, maxLength: 20 }
        edition: { type: string, maxLength: 100 }
        format: { $ref: '#/components/schemas/BookFormat' }
    CreateAuthorRequest:
      type: object
      required: [firstName, lastName]
      properties:
        firstName: { type: string, maxLength: 100 }
        lastName: { type: string, maxLength: 100 }
    UpdateAuthorRequest:
      type: object
      properties:
        firstName: { type: string, maxLength: 100 }
        lastName: { type: string, maxLength: 100 }
    CreateGenreRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 100 }
        description: { type: string, maxLength: 500 }
    RenameGenreRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 100 }
    CreatePublisherRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 200 }
        website: { type: string, maxLength: 255 }
        email: { type: string, maxLength: 255 }
        phone: { type: string, maxLength: 50 }
        country: { type: string, maxLength: 100 }
    UpdatePublisherRequest:
      type: object
      properties:
        name: { type: string, maxLength: 200 }
        website: { type: string, maxLength: 255 }
        email: { type: string, maxLength: 255 }
        phone: { type: string, maxLength: 50 }
        country: { type: string, maxLength: 100 }
    CreateBookStoreRequest:
      type: object
      required: [name, address]
      properties:
        name: { type: string, maxLength: 200 }
        address: { type: string, maxLength: 500 }
        phone: { type: string, maxLength: 50 }
        email: { type: string, maxLength: 255 }
    UpdateBookStoreRequest:
      type: object
      properties:
        name: { type: string, maxLength: 200 }
        address: { type: string, maxLength: 500 }
        phone: { type: string, maxLength: 50 }
        email: { type: string, maxLength: 255 }
    ArrivalRequest:
      type: object
      required: [editionId, quantity]
      properties:
        editionId: { type: string, format: uuid }
        quantity: { type: integer, minimum: 1 }
        reference: { type: string, maxLength: 100 }
    AdjustStockRequest:
      type: object
      required: [editionId, quantity]
      properties:
        editionId: { type: string, format: uuid }
        quantity: { type: integer }
        reason: { type: string, maxLength: 500 }
    StockLossRequest:
      type: object
      required: [editionId, quantity]
      properties:
        editionId: { type: string, format: uuid }
        quantity: { type: integer, minimum: 1 }
        reason: { type: string, maxLength: 500 }

    AuthorResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        firstName: { type: string }
        lastName: { type: string }
        fullName: { type: string }
        createdAt: { type: string, format: date-time }
    BookAuthorResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        bookId: { type: string, format: uuid }
        bookTitle: { type: string }
        authorId: { type: string, format: uuid }
        authorFullName: { type: string }
        role: { type: string, nullable: true }
        contributionOrder: { type: integer, nullable: true }
    GenreResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string, nullable: true }
    PublisherResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        website: { type: string, nullable: true }
        email: { type: string, nullable: true }
        phone: { type: string, nullable: true }
        country: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
    BookEditionResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        bookId: { type: string, format: uuid }
        bookTitle: { type: string }
        publisher: { $ref: '#/components/schemas/PublisherResponse' }
        isbn: { type: string }
        edition: { type: string, nullable: true }
        format: { type: string }
        active: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    BookSummaryResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        language: { type: string, nullable: true }
        coverUrl: { type: string, nullable: true }
        authorNames: { type: array, items: { type: string } }
        genreNames: { type: array, items: { type: string } }
        createdAt: { type: string, format: date-time }
    BookDetailResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        summary: { type: string, nullable: true }
        language: { type: string, nullable: true }
        coverUrl: { type: string, nullable: true }
        authors: { type: array, items: { $ref: '#/components/schemas/BookAuthorResponse' } }
        genres: { type: array, items: { $ref: '#/components/schemas/GenreResponse' } }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    BookStoreResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        address: { type: string }
        phone: { type: string, nullable: true }
        email: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    InventoryItemResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        storeId: { type: string, format: uuid }
        storeName: { type: string }
        editionId: { type: string, format: uuid }
        bookTitle: { type: string }
        isbn: { type: string }
        quantityOnHand: { type: integer }
        reorderLevel: { type: integer }
        lowStock: { type: boolean }
        updatedAt: { type: string, format: date-time }
    InventoryMovementResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        storeId: { type: string, format: uuid }
        editionId: { type: string, format: uuid }
        bookTitle: { type: string }
        isbn: { type: string }
        type: { type: string }
        quantity: { type: integer }
        signedQuantity: { type: integer }
        reason: { type: string, nullable: true }
        reference: { type: string, nullable: true }
        movedAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
    RevenuePerGenreResponse:
      type: object
      properties:
        genreName: { type: string }
        revenue: { type: number }

    # Customer
    CreateCustomerRequest:
      type: object
      required: [firstName, lastName, email]
      properties:
        firstName: { type: string, maxLength: 100 }
        lastName: { type: string, maxLength: 100 }
        email: { type: string, format: email, maxLength: 255 }
        phone: { type: string, maxLength: 50 }
    UpdateCustomerRequest:
      type: object
      properties:
        firstName: { type: string, maxLength: 100 }
        lastName: { type: string, maxLength: 100 }
        email: { type: string, format: email, maxLength: 255 }
        phone: { type: string, maxLength: 50 }
    CustomerResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        firstName: { type: string }
        lastName: { type: string }
        fullName: { type: string }
        email: { type: string }
        phone: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    SaleSummaryResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        storeId: { type: string, format: uuid }
        storeName: { type: string }
        customerId: { type: string, format: uuid, nullable: true }
        customerName: { type: string, nullable: true }
        status: { $ref: '#/components/schemas/SaleStatus' }
        paymentMethod: { $ref: '#/components/schemas/PaymentMethod' }
        total: { type: number }
    SaleStatus:
      type: string
      enum: [PENDING, PAID, CANCELLED, REFUNDED]
    PaymentMethod:
      type: string
      enum: [CASH, CARD, MOBILE_MONEY, BANK_TRANSFER]

    # BookPriceHistory
    CreateBookPriceRequest:
      type: object
      required: [price, effectiveFrom]
      properties:
        price: { type: number, minimum: 0 }
        effectiveFrom: { type: string, format: date-time }
    BookPriceResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        editionId: { type: string, format: uuid }
        price: { type: number }
        effectiveFrom: { type: string, format: date-time }
        effectiveTo: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }

    Exception:
      type: object
      properties:
        type: { type: string }
        message: { type: string }
    ErrorResponse:
      type: object
      properties:
        status: { type: integer }
        error: { type: string }
        message: { type: string }
        timestamp: { type: string, format: date-time }

paths:
  # Books
  /books:
    get:
      tags: [Books]
      summary: Search and list books (paginated)
      parameters:
        - in: query
          name: page
          schema: { type: integer, default: 0 }
        - in: query
          name: size
          schema: { type: integer, default: 20 }
        - in: query
          name: sortBy
          schema: { type: string, default: createdAt }
        - in: query
          name: sortDir
          schema: { type: string, default: desc }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  content: { type: array, items: { $ref: '#/components/schemas/BookSummaryResponse' } }
    post:
      tags: [Books]
      summary: Create new book
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateBookRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BookDetailResponse' }
  /books/{id}:
    get:
      tags: [Books]
      summary: Get full book detail with authors and editions
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BookDetailResponse' }
        '404': { description: Book not found }
    put:
      tags: [Books]
      summary: Update book fields
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateBookRequest' }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BookDetailResponse' }
    delete:
      tags: [Books]
      summary: Delete book and cascade to editions
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: Deleted }
        '404': { description: Not found }
  /editions/{editionId}/stock:
    get:
      tags: [Inventory]
      summary: Get total stock of an edition across all stores
      parameters:
        - in: path
          name: editionId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: integer }
  /books/{bookId}/stock:
    get:
      tags: [Books]
      summary: Get total stock of a book across all editions and all stores
      parameters:
        - in: path
          name: bookId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: integer }
  /books/low-stock:
    get:
      tags: [Books]
      summary: Get all low stock items across all stores
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/InventoryItemResponse' }
  /books/{id}/genres/{genreId}:
    post:
      tags: [Books]
      summary: Add genre to book
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
        - in: path
          name: genreId
          required: true
          schema: { type: string, format: uuid }
      responses: { '204': { description: No Content } }
    delete:
      tags: [Books]
      summary: Remove genre from book
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
        - in: path
          name: genreId
          required: true
          schema: { type: string, format: uuid }
      responses: { '204': { description: No Content } }

  # Book Authors
  /books/{bookId}/authors/{authorId}:
    post:
      tags: [BookAuthors]
      summary: Add author to book
      parameters:
        - in: path
          name: bookId
          required: true
          schema: { type: string, format: uuid }
        - in: path
          name: authorId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '201':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BookAuthorResponse' }
    delete:
      tags: [BookAuthors]
      summary: Remove author from book
      parameters:
        - in: path
          name: bookId
          required: true
          schema: { type: string, format: uuid }
        - in: path
          name: authorId
          required: true
          schema: { type: string, format: uuid }
      responses: { '204': { description: Removed } }

  # Authors
  /authors:
    get:
      tags: [Authors]
      summary: Search authors by name (paginated)
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  content: { type: array, items: { $ref: '#/components/schemas/AuthorResponse' } }
    post:
      tags: [Authors]
      summary: Create author
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateAuthorRequest' }
      responses:
        '201':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthorResponse' }
  /authors/{id}:
    get:
      tags: [Authors]
      summary: Get author detail
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthorResponse' }
    put:
      tags: [Authors]
      summary: Update author
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateAuthorRequest' }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthorResponse' }
    delete:
      tags: [Authors]
      summary: Delete author
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses: { '204': { description: Deleted } }

  # Book Editions
  /books/{bookId}/editions:
    get:
      tags: [BookEditions]
      summary: List editions for a book
      parameters:
        - in: path
          name: bookId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/BookEditionResponse' }
    post:
      tags: [BookEditions]
      summary: Create edition under a book
      parameters:
        - in: path
          name: bookId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateBookEditionRequest' }
      responses:
        '201':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BookEditionResponse' }
  /editions/{id}:
    get:
      tags: [BookEditions]
      summary: Get edition detail
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BookEditionResponse' }
    put:
      tags: [BookEditions]
      summary: Update edition
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateBookEditionRequest' }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BookEditionResponse' }
  /editions/isbn/{isbn}:
    get:
      tags: [BookEditions]
      summary: Lookup by ISBN
      parameters:
        - in: path
          name: isbn
          required: true
          schema: { type: string }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BookEditionResponse' }
  /editions/{id}/activate:
    patch:
      tags: [BookEditions]
      summary: Activate edition for sale
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BookEditionResponse' }
  /editions/{id}/deactivate:
    patch:
      tags: [BookEditions]
      summary: Deactivate edition
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BookEditionResponse' }

  # BookPriceHistory
  /editions/{id}/prices:
    get:
      tags: [BookPriceHistory]
      summary: List all price records for an edition
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/BookPriceResponse' }
    post:
      tags: [BookPriceHistory]
      summary: Set a new price for an edition (closes previous current price)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateBookPriceRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BookPriceResponse' }
  /editions/{id}/prices/current:
    get:
      tags: [BookPriceHistory]
      summary: Get the current active price for an edition
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BookPriceResponse' }
        '404': { description: No price found }

  # Genres
  /genres:
    get:
      tags: [Genres]
      summary: List all genres (paginated)
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  content: { type: array, items: { $ref: '#/components/schemas/GenreResponse' } }
    post:
      tags: [Genres]
      summary: Create genre
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateGenreRequest' }
      responses:
        '201':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GenreResponse' }
  /genres/{id}/books:
    get:
      tags: [Genres]
      summary: Books in genre (paginated)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  content: { type: array, items: { $ref: '#/components/schemas/BookSummaryResponse' } }
  /genres/{id}/rename:
    patch:
      tags: [Genres]
      summary: Rename genre
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RenameGenreRequest' }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GenreResponse' }
  /genres/{id}:
    delete:
      tags: [Genres]
      summary: Delete genre
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses: { '204': { description: Deleted } }
  /genres/revenue:
    get:
      tags: [Genres]
      summary: Revenue per genre (dashboard)
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/RevenuePerGenreResponse' }

  # Publishers
  /publishers:
    get:
      tags: [Publishers]
      summary: List and search publishers (paginated)
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  content: { type: array, items: { $ref: '#/components/schemas/PublisherResponse' } }
    post:
      tags: [Publishers]
      summary: Create publisher
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreatePublisherRequest' }
      responses:
        '201':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublisherResponse' }
  /publishers/{id}:
    get:
      tags: [Publishers]
      summary: Get publisher detail
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublisherResponse' }
    put:
      tags: [Publishers]
      summary: Update publisher
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdatePublisherRequest' }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublisherResponse' }
    delete:
      tags: [Publishers]
      summary: Delete publisher
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses: { '204': { description: Deleted } }

  # BookStores
  /stores:
    get:
      tags: [BookStores]
      summary: List all stores (paginated)
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  content: { type: array, items: { $ref: '#/components/schemas/BookStoreResponse' } }
    post:
      tags: [BookStores]
      summary: Create store
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateBookStoreRequest' }
      responses:
        '201':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BookStoreResponse' }
  /stores/{id}:
    get:
      tags: [BookStores]
      summary: Get store detail
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BookStoreResponse' }
    put:
      tags: [BookStores]
      summary: Update store
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateBookStoreRequest' }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BookStoreResponse' }
    delete:
      tags: [BookStores]
      summary: Delete store
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses: { '204': { description: Deleted } }
  /stores/{id}/stock/{editionId}:
    get:
      tags: [BookStores]
      summary: Stock quantity for specific edition at a store
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
        - in: path
          name: editionId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: integer }
  /stores/{id}/books/{bookId}/stock:
    get:
      tags: [BookStores]
      summary: Total stock of a book (all editions) at a specific store
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
        - in: path
          name: bookId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: integer }

  /stores/{id}/low-stock:
    get:
      tags: [BookStores]
      summary: Low stock items at a store (quantity <= reorder level)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/InventoryItemResponse' }

  # Customers
  /customers:
    get:
      tags: [Customers]
      summary: List all customers
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/CustomerResponse' }
    post:
      tags: [Customers]
      summary: Create a customer
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateCustomerRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomerResponse' }
  /customers/{id}:
    get:
      tags: [Customers]
      summary: Get customer detail
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomerResponse' }
        '404': { description: Customer not found }
    put:
      tags: [Customers]
      summary: Update customer
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateCustomerRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomerResponse' }
  /customers/{id}/sales:
    get:
      tags: [Customers]
      summary: List sales for a customer
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/SaleSummaryResponse' }

  # Inventory
  /stores/{storeId}/inventory/arrival:
    post:
      tags: [Inventory]
      summary: Record book arrival (+stock)
      parameters:
        - in: path
          name: storeId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ArrivalRequest' }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InventoryItemResponse' }
  /stores/{storeId}/inventory/adjustment:
    post:
      tags: [Inventory]
      summary: Manual stock adjustment (+/-)
      parameters:
        - in: path
          name: storeId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdjustStockRequest' }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InventoryItemResponse' }
  /stores/{storeId}/inventory/damaged:
    post:
      tags: [Inventory]
      summary: Mark copies damaged (-stock)
      parameters:
        - in: path
          name: storeId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StockLossRequest' }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InventoryItemResponse' }
  /stores/{storeId}/inventory/lost:
    post:
      tags: [Inventory]
      summary: Mark copies lost (-stock)
      parameters:
        - in: path
          name: storeId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StockLossRequest' }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InventoryItemResponse' }
  /stores/{storeId}/movements:
    get:
      tags: [Inventory]
      summary: Movement log (filter by type)
      parameters:
        - in: path
          name: storeId
          required: true
          schema: { type: string, format: uuid }
        - in: query
          name: type
          required: false
          schema: { $ref: '#/components/schemas/InventoryMovementType' }
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/InventoryMovementResponse' }
  /editions/{editionId}/movements:
    get:
      tags: [Inventory]
      summary: Inventory movements for an edition (across all stores)
      parameters:
        - in: path
          name: editionId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/InventoryMovementResponse' }