openapi: "3.0.3"
info:
  title: Bookstore API
  version: "1.0.0"
  description: >
    REST API for the onlydevs bookstore digitalization platform.
    Covers catalog management, inventory tracking, and point-of-sale.
servers:
  - url: /api/v1
    description: Default server
tags:
  - name: Books
  - name: BookAuthors
  - name: Authors
  - name: BookEditions
  - name: Genres
  - name: Publishers
  - name: BookStores
  - name: Inventory
  - name: Customers
  - name: Sales
  - name: Dashboard
components:
  schemas:
    # Enums
    AuthorRole:
      type: string
      enum: [PRIMARY, CO_AUTHOR, EDITOR, TRANSLATOR, ILLUSTRATOR, FOREWORD]
    BookFormat:
      type: string
      enum: [HARDCOVER, PAPERBACK, EBOOK, AUDIOBOOK]
    SaleStatus:
      type: string
      enum: [PENDING, PAID, CANCELLED, REFUNDED]
    PaymentMethod:
      type: string
      enum: [CASH, CARD, MOBILE_MONEY, BANK_TRANSFER]
    InventoryMovementType:
      type: string
      enum: [ARRIVAL, SALE, RETURN, ADJUSTMENT, DAMAGED, LOST]

    # Request DTOs
    CreateBookRequest:
      type: object
      required: [title]
      properties:
        title: { type: string, maxLength: 255 }
        summary: { type: string, maxLength: 2000 }
        language: { type: string, maxLength: 50 }
        coverUrl: { type: string, maxLength: 500 }
    UpdateBookRequest:
      type: object
      properties:
        title: { type: string, maxLength: 255 }
        summary: { type: string, maxLength: 2000 }
        language: { type: string, maxLength: 50 }
        coverUrl: { type: string, maxLength: 500 }
    CreateBookEditionRequest:
      type: object
      required: [publisherId, isbn, format]
      properties:
        publisherId: { type: string, format: uuid }
        isbn: { type: string, maxLength: 20 }
        edition: { type: string, maxLength: 100 }
        format: { $ref: '#/components/schemas/BookFormat' }
    UpdateBookEditionRequest:
      type: object
      properties:
        isbn: { type: string, maxLength: 20 }
        edition: { type: string, maxLength: 100 }
        format: { $ref: '#/components/schemas/BookFormat' }
    CreateAuthorRequest:
      type: object
      required: [firstName, lastName]
      properties:
        firstName: { type: string, maxLength: 100 }
        lastName: { type: string, maxLength: 100 }
    UpdateAuthorRequest:
      type: object
      properties:
        firstName: { type: string, maxLength: 100 }
        lastName: { type: string, maxLength: 100 }
    AddBookAuthorRequest:
      type: object
      required: [role]
      properties:
        role: { $ref: '#/components/schemas/AuthorRole' }
        contributionOrder: { type: integer, minimum: 1 }
    ChangeAuthorRoleRequest:
      type: object
      required: [role]
      properties:
        role: { $ref: '#/components/schemas/AuthorRole' }
    UpdateContributionOrderRequest:
      type: object
      required: [contributionOrder]
      properties:
        contributionOrder: { type: integer, minimum: 1 }
    ReorderAuthorsRequest:
      type: object
      required: [authorIDs]
      properties:
        authorIDs:
          type: array
          items: { type: string, format: uuid }
    CreateGenreRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 100 }
        description: { type: string, maxLength: 500 }
    RenameGenreRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 100 }
    CreatePublisherRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 200 }
        website: { type: string, maxLength: 255 }
        email: { type: string, maxLength: 255 }
        phone: { type: string, maxLength: 50 }
        country: { type: string, maxLength: 100 }
    UpdatePublisherRequest:
      type: object
      properties:
        name: { type: string, maxLength: 200 }
        website: { type: string, maxLength: 255 }
        email: { type: string, maxLength: 255 }
        phone: { type: string, maxLength: 50 }
        country: { type: string, maxLength: 100 }
    CreateCustomerRequest:
      type: object
      required: [firstName, lastName, email]
      properties:
        firstName: { type: string, maxLength: 100 }
        lastName: { type: string, maxLength: 100 }
        email: { type: string, maxLength: 255 }
        phone: { type: string, maxLength: 50 }
    UpdateCustomerRequest:
      type: object
      properties:
        firstName: { type: string, maxLength: 100 }
        lastName: { type: string, maxLength: 100 }
        email: { type: string, maxLength: 255 }
        phone: { type: string, maxLength: 50 }
    CreateBookStoreRequest:
      type: object
      required: [name, address]
      properties:
        name: { type: string, maxLength: 200 }
        address: { type: string, maxLength: 500 }
        phone: { type: string, maxLength: 50 }
        email: { type: string, maxLength: 255 }
    UpdateBookStoreRequest:
      type: object
      properties:
        name: { type: string, maxLength: 200 }
        address: { type: string, maxLength: 500 }
        phone: { type: string, maxLength: 50 }
        email: { type: string, maxLength: 255 }
    OpenSaleRequest:
      type: object
      properties:
        customerId: { type: string, format: uuid }
    AddSaleItemRequest:
      type: object
      required: [editionId, quantity]
      properties:
        editionId: { type: string, format: uuid }
        quantity: { type: integer, minimum: 1 }
    ConfirmSaleRequest:
      type: object
      required: [paymentMethod]
      properties:
        paymentMethod: { $ref: '#/components/schemas/PaymentMethod' }
    ArrivalRequest:
      type: object
      required: [editionId, quantity]
      properties:
        editionId: { type: string, format: uuid }
        quantity: { type: integer, minimum: 1 }
        reference: { type: string, maxLength: 100 }
    AdjustStockRequest:
      type: object
      required: [editionId, quantity]
      properties:
        editionId: { type: string, format: uuid }
        quantity: { type: integer }
        reason: { type: string, maxLength: 500 }
    StockLossRequest:
      type: object
      required: [editionId, quantity]
      properties:
        editionId: { type: string, format: uuid }
        quantity: { type: integer, minimum: 1 }
        reason: { type: string, maxLength: 500 }
    SetPriceRequest:
      type: object
      required: [price, effectiveFrom]
      properties:
        price: { type: number, minimum: 0.01 }
        effectiveFrom: { type: string, format: date-time }

    # Response DTOs
    AuthorResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        firstName: { type: string }
        lastName: { type: string }
        fullName: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    BookAuthorResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        bookId: { type: string, format: uuid }
        bookTitle: { type: string }
        authorId: { type: string, format: uuid }
        authorFullName: { type: string }
        role: { $ref: '#/components/schemas/AuthorRole' }
        contributionOrder: { type: integer }
    GenreResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string, nullable: true }
    PublisherResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        website: { type: string, nullable: true }
        email: { type: string, nullable: true }
        phone: { type: string, nullable: true }
        country: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
    PriceResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        price: { type: number }
        effectiveFrom: { type: string, format: date-time }
        effectiveTo: { type: string, format: date-time, nullable: true }
        active: { type: boolean }
        createdAt: { type: string, format: date-time }
    BookEditionResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        bookId: { type: string, format: uuid }
        bookTitle: { type: string }
        publisher: { $ref: '#/components/schemas/PublisherResponse' }
        isbn: { type: string }
        edition: { type: string, nullable: true }
        format: { $ref: '#/components/schemas/BookFormat' }
        active: { type: boolean }
        currentPrice: { type: number, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    BookSummaryResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        language: { type: string, nullable: true }
        coverUrl: { type: string, nullable: true }
        authorNames: { type: array, items: { type: string } }
        genreNames: { type: array, items: { type: string } }
        createdAt: { type: string, format: date-time }
    BookDetailResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        summary: { type: string, nullable: true }
        language: { type: string, nullable: true }
        coverUrl: { type: string, nullable: true }
        authors: { type: array, items: { $ref: '#/components/schemas/BookAuthorResponse' } }
        genres: { type: array, items: { $ref: '#/components/schemas/GenreResponse' } }
        editions: { type: array, items: { $ref: '#/components/schemas/BookEditionResponse' } }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    BookStoreResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        address: { type: string }
        phone: { type: string, nullable: true }
        email: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    InventoryItemResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        storeId: { type: string, format: uuid }
        storeName: { type: string }
        editionId: { type: string, format: uuid }
        bookTitle: { type: string }
        isbn: { type: string }
        format: { $ref: '#/components/schemas/BookFormat' }
        quantityOnHand: { type: integer }
        reorderLevel: { type: integer }
        lowStock: { type: boolean }
        updatedAt: { type: string, format: date-time }
    InventoryMovementResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        storeId: { type: string, format: uuid }
        editionId: { type: string, format: uuid }
        bookTitle: { type: string }
        isbn: { type: string }
        type: { $ref: '#/components/schemas/InventoryMovementType' }
        quantity: { type: integer }
        signedQuantity: { type: integer }
        reason: { type: string, nullable: true }
        reference: { type: string, nullable: true }
        movedAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
    CustomerResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        firstName: { type: string }
        lastName: { type: string }
        fullName: { type: string }
        email: { type: string }
        phone: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    SaleItemResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        editionId: { type: string, format: uuid }
        bookTitle: { type: string }
        isbn: { type: string }
        format: { $ref: '#/components/schemas/BookFormat' }
        quantity: { type: integer }
        unitPrice: { type: number }
        discount: { type: number }
        subtotal: { type: number }
        createdAt: { type: string, format: date-time }
    SaleSummaryResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        storeId: { type: string, format: uuid }
        storeName: { type: string }
        customerId: { type: string, format: uuid, nullable: true }
        customerName: { type: string, nullable: true }
        status: { $ref: '#/components/schemas/SaleStatus' }
        paymentMethod: { $ref: '#/components/schemas/PaymentMethod', nullable: true }
        total: { type: number }
        itemCount: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    SaleDetailResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        storeId: { type: string, format: uuid }
        storeName: { type: string }
        customer: { $ref: '#/components/schemas/CustomerResponse', nullable: true }
        status: { $ref: '#/components/schemas/SaleStatus' }
        paymentMethod: { $ref: '#/components/schemas/PaymentMethod', nullable: true }
        items: { type: array, items: { $ref: '#/components/schemas/SaleItemResponse' } }
        total: { type: number }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    RevenueResponse:
      type: object
      properties:
        revenue: { type: number }
        period: { type: string }
    TopSellerResponse:
      type: object
      properties:
        editionId: { type: string, format: uuid }
        bookTitle: { type: string }
        isbn: { type: string }
        format: { $ref: '#/components/schemas/BookFormat' }
        totalQuantitySold: { type: integer }
        totalRevenue: { type: number }
    RevenuePerGenreResponse:
      type: object
      properties:
        genreName: { type: string }
        revenue: { type: number }
    Exception:
      type: object
      properties:
        type: { type: string }
        message: { type: string }
    ErrorResponse:
      type: object
      properties:
        status: { type: integer }
        error: { type: string }
        message: { type: string }
        timestamp: { type: string, format: date-time }

paths:
  # Books
  /books:
    get:
      tags: [Books]
      summary: Search and list books (paginated)
      responses: { '200': { description: OK } }
    post:
      tags: [Books]
      summary: Create new book
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateBookRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BookDetailResponse' }
  /books/{id}:
    get:
      tags: [Books]
      summary: Get full book detail with authors and editions
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BookDetailResponse' }
        '404': { description: Book not found }
    put:
      tags: [Books]
      summary: Update book fields
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateBookRequest' }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BookDetailResponse' }
    delete:
      tags: [Books]
      summary: Delete book and cascade to editions
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: Deleted }
        '404': { description: Not found }
  /books/{id}/genres/{genreId}:
    post:
      tags: [Books]
      summary: Add genre to book
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
        - in: path
          name: genreId
          required: true
          schema: { type: string, format: uuid }
      responses: { '204': { description: No Content } }
    delete:
      tags: [Books]
      summary: Remove genre from book
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
        - in: path
          name: genreId
          required: true
          schema: { type: string, format: uuid }
      responses: { '204': { description: No Content } }

  # Book Authors
  /books/{bookId}/authors:
    get:
      tags: [BookAuthors]
      summary: Authors for a book ordered by contributionOrder
      parameters:
        - in: path
          name: bookId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/BookAuthorResponse' }
  /books/{bookId}/authors/{authorId}:
    post:
      tags: [BookAuthors]
      summary: Add author to book with role
      parameters:
        - in: path
          name: bookId
          required: true
          schema: { type: string, format: uuid }
        - in: path
          name: authorId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddBookAuthorRequest' }
      responses:
        '201':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BookAuthorResponse' }
        '409': { description: Author already linked to this book }
    delete:
      tags: [BookAuthors]
      summary: Remove author from book
      parameters:
        - in: path
          name: bookId
          required: true
          schema: { type: string, format: uuid }
        - in: path
          name: authorId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: Removed }
        '400': { description: Cannot remove last author }
  /books/{bookId}/authors/{authorId}/role:
    patch:
      tags: [BookAuthors]
      summary: Change author role on book
      parameters:
        - in: path
          name: bookId
          required: true
          schema: { type: string, format: uuid }
        - in: path
          name: authorId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangeAuthorRoleRequest' }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BookAuthorResponse' }
  /books/{bookId}/authors/reorder:
    patch:
      tags: [BookAuthors]
      summary: Bulk reorder all authors on a book
      parameters:
        - in: path
          name: bookId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReorderAuthorsRequest' }
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/BookAuthorResponse' }
  /authors/{authorId}/books:
    get:
      tags: [BookAuthors]
      summary: All books an author contributed to
      parameters:
        - in: path
          name: authorId
          required: true
          schema: { type: string, format: uuid }
        - in: query
          name: role
          schema: { $ref: '#/components/schemas/AuthorRole' }
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/BookAuthorResponse' }
  /authors/{authorId}/contributions:
    get:
      tags: [BookAuthors]
      summary: Role breakdown map for author profile
      parameters:
        - in: path
          name: authorId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Map of AuthorRole to count
          content:
            application/json:
              schema:
                type: object
                additionalProperties: { type: integer }

  # Authors
  /authors:
    get:
      tags: [Authors]
      summary: Search authors by name
      responses: { '200': { description: OK } }
    post:
      tags: [Authors]
      summary: Create author
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateAuthorRequest' }
      responses:
        '201':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthorResponse' }
  /authors/{id}:
    get:
      tags: [Authors]
      summary: Get author detail
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthorResponse' }
    put:
      tags: [Authors]
      summary: Update author
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateAuthorRequest' }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthorResponse' }
    delete:
      tags: [Authors]
      summary: Delete author
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses: { '204': { description: Deleted } }

  # Book Editions
  /books/{bookId}/editions:
    get:
      tags: [BookEditions]
      summary: List editions for a book (paginated)
      parameters:
        - in: path
          name: bookId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/BookEditionResponse' }
    post:
      tags: [BookEditions]
      summary: Create edition under a book
      parameters:
        - in: path
          name: bookId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateBookEditionRequest' }
      responses:
        '201':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BookEditionResponse' }
  /editions/{id}:
    get:
      tags: [BookEditions]
      summary: Get edition detail
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BookEditionResponse' }
    put:
      tags: [BookEditions]
      summary: Update edition
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateBookEditionRequest' }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BookEditionResponse' }
  /editions/isbn/{isbn}:
    get:
      tags: [BookEditions]
      summary: Lookup by ISBN (barcode scan)
      parameters:
        - in: path
          name: isbn
          required: true
          schema: { type: string }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BookEditionResponse' }
  /editions/{id}/activate:
    patch:
      tags: [BookEditions]
      summary: Activate edition for sale
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BookEditionResponse' }
  /editions/{id}/deactivate:
    patch:
      tags: [BookEditions]
      summary: Deactivate edition
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BookEditionResponse' }
  /editions/{id}/prices:
    get:
      tags: [BookEditions]
      summary: Full price history
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PriceResponse' }
    post:
      tags: [BookEditions]
      summary: Set new price (auto-closes previous)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
