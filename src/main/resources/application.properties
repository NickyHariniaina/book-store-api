spring.application.name=BOOK-STORE-API
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.h2.console.enabled=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.baseline-on-migrate=true
aws.eventBridge.bus=${AWS_EVENT_BRIDGE_BUS:default-bus}
springdoc.swagger-ui.enabled=false
external.api.openlibrary.url=${EXTERNAL_API_OPENLIBRARY_URL:https://openlibrary.org}
external.api.googlebooks.url=${EXTERNAL_API_GOOGLEBOOKS_URL:https://www.googleapis.com/books/v1}
external.api.googlebooks.key=${EXTERNAL_API_GOOGLEBOOKS_KEY}
